[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-hud"
dynamic = ["version"]
description = "A compact, provider-aware HUD for coding-agent CLIs"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["codex", "claude-code", "kimi-cli", "coding-agent", "statusline", "terminal"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.scripts]
llm-hud = "llm_hud.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "llm_hud._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["llm_hud*"]

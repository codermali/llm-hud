[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-hud"
dynamic = ["version"]
description = "A compact, provider-aware HUD for coding-agent CLIs"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE", "src/llm_hud/_vendor/tomli/LICENSE"]
keywords = ["codex", "claude-code", "kimi-cli", "coding-agent", "statusline", "terminal"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.scripts]
llm-hud = "llm_hud.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "llm_hud._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["llm_hud*"]

[tool.setuptools.package-data]
"llm_hud._vendor.tomli" = ["LICENSE"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
# B904 (raise ... from) is stylistic, and the frozen stable-protocol scripts
# cannot change without a protocol revision.
ignore = ["B904"]

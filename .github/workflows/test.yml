name: test

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - run: pip install 'ruff==0.16.*'
      - run: ruff check --no-cache src tests scripts

  distribution-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.9"
      - run: python -m pip install 'build==1.3.*'
      - run: python -m build
      - run: python scripts/verify_distribution.py dist

  unit-tests:
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -t . -v
      - run: python bin/llm-hud --version

  macos-unit-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
      - run: python -m unittest discover -s tests -t . -v
      - run: python bin/llm-hud --version

  windows-selected-tests:
    name: Windows selected tests (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run native Windows coverage
        run: >-
          python -m unittest -v
          tests.test_claude
          tests.test_codex
          tests.test_hud
          tests.test_kimi
          tests.test_runtime
          tests.test_stable_control
          tests.test_storage
          tests.test_toml_edit
          tests.test_state_abi
          tests.test_version
      - name: Run native Windows installer failure coverage
        run: >-
          python -m unittest -v
          tests.test_installer_module.RuntimeInstallerTests.test_failed_trash_removal_does_not_block_same_release_reinstall
          tests.test_installer_module.RuntimeInstallerTests.test_failed_trash_rename_keeps_the_original_runtime_valid
          tests.test_installer_module.RuntimeInstallerTests.test_first_install_removes_its_launcher_when_pointer_write_fails
          tests.test_installer_module.RuntimeInstallerTests.test_post_activation_failure_restores_the_activation_actually_replaced
          tests.test_installer_module.RuntimeInstallerTests.test_post_activation_failure_holds_the_lock_against_an_aba_update
          tests.test_installer_module.RuntimeInstallerTests.test_first_install_failure_holds_the_lock_until_activation_is_cleared
          tests.test_installer_module.RuntimeInstallerTests.test_stable_tools_install_reuses_the_preflighted_snapshot
          tests.test_installer_module.RuntimeInstallerTests.test_oversized_stable_tools_are_rejected_before_any_install_write
          tests.test_installer_module.RuntimeInstallerTests.test_first_install_failure_removes_new_stable_tools
          tests.test_installer_module.RuntimeInstallerTests.test_partial_stable_tools_write_is_rolled_back
          tests.test_installer_module.RuntimeInstallerTests.test_upgrade_failure_restores_stable_tools_and_legacy_state
          tests.test_installer_module.RuntimeInstallerTests.test_stable_tools_are_restored_when_dispatcher_write_lands_then_fails
      - run: python bin/llm-hud --version

  old-python-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.8"
      - name: Launcher refuses to run and explains why
        run: |
          if python bin/llm-hud --version 2>"$RUNNER_TEMP/err"; then
            echo "expected a non-zero exit on Python 3.8"; exit 1
          fi
          grep -q "requires Python 3.9" "$RUNNER_TEMP/err"
      - name: Installer rejects an old LLM_HUD_PYTHON
        run: |
          if LLM_HUD_PYTHON=$(command -v python) ./install.sh 2>"$RUNNER_TEMP/err2"; then
            echo "expected a non-zero exit for an old interpreter"; exit 1
          fi
          grep -q "requires Python 3.9" "$RUNNER_TEMP/err2"

  installer-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.9"
      - name: Install into an isolated prefix
        run: |
          ./install.sh
        env:
          LLM_HUD_INSTALL_DIR: ${{ runner.temp }}/llm-hud
          LLM_HUD_BIN_DIR: ${{ runner.temp }}/bin
          LLM_HUD_STATE_DIR: ${{ runner.temp }}/state
          LLM_HUD_CLAUDE_SETTINGS: ${{ runner.temp }}/claude-settings.json
          LLM_HUD_CODEX_CONFIG: ${{ runner.temp }}/codex-config.toml
          LLM_HUD_CLAUDE_BIN: python

      - name: Launcher pins an absolute interpreter and runs without Python on PATH
        run: |
          launcher="$RUNNER_TEMP/bin/llm-hud"
          test ! -L "$launcher"
          grep -qx '# llm-hud-managed-launcher-v1' "$launcher"
          grep -qE '^exec /.+ -I -B /.+ "\$@"$' "$launcher"
          mkdir -p "$RUNNER_TEMP/empty"
          PATH="$RUNNER_TEMP/empty" "$launcher" --version
      - name: doctor and uninstall
        run: |
          "$RUNNER_TEMP/bin/llm-hud" doctor
          "$RUNNER_TEMP/bin/llm-hud" uninstall
        env:
          LLM_HUD_STATE_DIR: ${{ runner.temp }}/state
          LLM_HUD_CLAUDE_SETTINGS: ${{ runner.temp }}/claude-settings.json
          LLM_HUD_CODEX_CONFIG: ${{ runner.temp }}/codex-config.toml
          LLM_HUD_CLAUDE_BIN: python
      - name: Installer fails when no agent CLI is present
        run: |
          if ./install.sh; then
            echo "expected a non-zero exit when nothing is detected"; exit 1
          fi
        env:
          LLM_HUD_INSTALL_DIR: ${{ runner.temp }}/none/llm-hud
          LLM_HUD_BIN_DIR: ${{ runner.temp }}/none/bin
          LLM_HUD_STATE_DIR: ${{ runner.temp }}/none/state
          LLM_HUD_CLAUDE_BIN: ""
          LLM_HUD_CODEX_BIN: ""
          LLM_HUD_KIMI_BIN: ""

  macos-apple-python-smoke:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install with Apple's Command Line Tools Python
        run: |
          test "$(/usr/bin/python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')" = 3.9
          PATH=/usr/bin:/bin ./install.sh
          grep -q '^exec /usr/bin/python3 ' "$RUNNER_TEMP/bin/llm-hud"
          "$RUNNER_TEMP/bin/llm-hud" --version
          "$RUNNER_TEMP/bin/llm-hud" doctor
          "$RUNNER_TEMP/bin/llm-hud" uninstall
        env:
          LLM_HUD_INSTALL_DIR: ${{ runner.temp }}/llm-hud
          LLM_HUD_BIN_DIR: ${{ runner.temp }}/bin
          LLM_HUD_STATE_DIR: ${{ runner.temp }}/state
          LLM_HUD_CLAUDE_SETTINGS: ${{ runner.temp }}/claude-settings.json
          LLM_HUD_CODEX_CONFIG: ${{ runner.temp }}/codex-config.toml
          LLM_HUD_CLAUDE_BIN: /usr/bin/python3
          LLM_HUD_CODEX_BIN: ""
          LLM_HUD_KIMI_BIN: ""

  windows-installer-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.9"
      - name: Install, upgrade, roll back, diagnose, and uninstall through Git Bash
        shell: bash
        run: |
          test_root=$(cygpath -u "$RUNNER_TEMP")/llm-hud-windows
          export LLM_HUD_INSTALL_DIR="$test_root/runtime"
          export LLM_HUD_BIN_DIR="$test_root/bin"
          export LLM_HUD_STATE_DIR="$test_root/state"
          export LLM_HUD_CLAUDE_SETTINGS="$test_root/claude-settings.json"
          export LLM_HUD_CODEX_CONFIG="$test_root/codex-config.toml"
          export LLM_HUD_CLAUDE_BIN=python
          export LLM_HUD_CODEX_BIN=
          export LLM_HUD_KIMI_BIN=

          mkdir -p "$test_root"
          printf '%s\n' '{"statusLine":{"type":"command","command":"printf existing"}}' > "$LLM_HUD_CLAUDE_SETTINGS"
          ./install.sh
          launcher="$LLM_HUD_BIN_DIR/llm-hud"
          test -f "$launcher"
          grep -qx '# llm-hud-managed-launcher-v1' "$launcher"
          "$launcher" --version
          "$launcher" doctor
          first_version=$("$launcher" --version)
          first_active=$(awk 'NR == 1 { print $2 }' "$LLM_HUD_INSTALL_DIR/activation")
          test -n "$first_active"

          second_source="$test_root/second-source"
          mkdir "$second_source"
          git archive --format=tar HEAD | tar -xf - -C "$second_source"
          version_file="$second_source/src/llm_hud/_version.py"
          next_version=$(python -I -B -c '
          import runpy, sys
          value = runpy.run_path(sys.argv[1])["__version__"]
          major, minor, patch = map(int, value.split("+")[0].split("-")[0].split("."))
          print(f"{major}.{minor}.{patch + 1}")
          ' "$version_file")
          sed -i -E "s/^__version__ = \"[^\"]+\"$/__version__ = \"$next_version\"/" "$version_file"
          grep -qx "__version__ = \"$next_version\"" "$version_file"
          sh "$second_source/install.sh"
          second_active=$(awk 'NR == 1 { print $2 }' "$LLM_HUD_INSTALL_DIR/activation")
          test -n "$second_active"
          test "$second_active" != "$first_active"
          test "$("$launcher" --version)" = "llm-hud $next_version"
          "$launcher" rollback
          rolled_back_active=$(awk 'NR == 1 { print $2 }' "$LLM_HUD_INSTALL_DIR/activation")
          rolled_back_previous=$(awk 'NR == 1 { print $3 }' "$LLM_HUD_INSTALL_DIR/activation")
          test "$rolled_back_active" = "$first_active"
          test "$rolled_back_previous" = "$second_active"
          test "$("$launcher" --version)" = "$first_version"

          python -c 'import json, pathlib, sys; command = json.loads(pathlib.Path(sys.argv[1]).read_text())["statusLine"]["command"]; assert "\\" not in command, command' "$LLM_HUD_CLAUDE_SETTINGS"
          test "$(printf '{}' | "$launcher" render claude --no-color | head -n 1)" = existing
          "$launcher" uninstall
          python -c 'import json, pathlib, sys; assert json.loads(pathlib.Path(sys.argv[1]).read_text())["statusLine"]["command"] == "printf existing"' "$LLM_HUD_CLAUDE_SETTINGS"

  bootstrap-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.9"
      - name: Install from a tarball the way curl | sh does
        run: |
          git archive --prefix=llm-hud-main/ HEAD | gzip > "$RUNNER_TEMP/src.tgz"
          (cd "$RUNNER_TEMP" && sha256sum src.tgz | sed 's/src\.tgz/llm-hud.tar.gz/' > SHA256SUMS)
          mkdir -p "$RUNNER_TEMP/elsewhere"
          cd "$RUNNER_TEMP/elsewhere"
          cat "$GITHUB_WORKSPACE/install.sh" | sh
          "$RUNNER_TEMP/bin/llm-hud" --version
        env:
          LLM_HUD_TARBALL_URL: file://${{ runner.temp }}/src.tgz
          LLM_HUD_CHECKSUM_URL: file://${{ runner.temp }}/SHA256SUMS
          LLM_HUD_INSTALL_DIR: ${{ runner.temp }}/llm-hud
          LLM_HUD_BIN_DIR: ${{ runner.temp }}/bin
          LLM_HUD_STATE_DIR: ${{ runner.temp }}/state
          LLM_HUD_CLAUDE_SETTINGS: ${{ runner.temp }}/claude-settings.json
          LLM_HUD_CODEX_CONFIG: ${{ runner.temp }}/codex-config.toml
          LLM_HUD_CLAUDE_BIN: python

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate tag and package version
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must use vX.Y.Z" >&2
            exit 1
          fi
          version=$(python -I -B -c \
            'import runpy; print(runpy.run_path("src/llm_hud/_version.py")["__version__"])')
          if [[ "$tag" != "v$version" ]]; then
            echo "tag $tag does not match package version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Run tests
        run: python -m unittest discover -s tests -t . -v

      - name: Build and verify release archive
        shell: bash
        run: |
          mkdir dist
          git archive --format=tar --prefix="llm-hud-$VERSION/" "$GITHUB_SHA" |
            gzip -n > dist/llm-hud.tar.gz
          cd dist
          sha256sum llm-hud.tar.gz > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Smoke test release archive
        shell: bash
        run: |
          target="$RUNNER_TEMP/release-smoke"
          mkdir "$target"
          tar -xzf dist/llm-hud.tar.gz -C "$target"
          output=$(python -I -B "$target/llm-hud-$VERSION/bin/llm-hud" --version)
          test "$output" = "llm-hud $VERSION"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/llm-hud.tar.gz \
            dist/SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --title "LLM HUD $VERSION"

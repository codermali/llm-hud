name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/test.yml

  build_artifacts:
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release_metadata.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.9"

      - name: Validate tag and package version
        id: release_metadata
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must use vX.Y.Z" >&2
            exit 1
          fi
          version=$(python -I -B -c \
            'import runpy; print(runpy.run_path("src/llm_hud/_version.py")["__version__"])')
          if [[ "$tag" != "v$version" ]]; then
            echo "tag $tag does not match package version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and verify release archive
        shell: bash
        run: |
          mkdir dist
          git archive --format=tar --prefix="llm-hud-$VERSION/" "$GITHUB_SHA" |
            gzip -n > dist/llm-hud.tar.gz
          cp install.sh dist/install.sh
          sed -i \
            "s/^embedded_release_tag='__LLM_HUD_RELEASE_TAG__'$/embedded_release_tag='$GITHUB_REF_NAME'/" \
            dist/install.sh
          grep -Fqx "embedded_release_tag='$GITHUB_REF_NAME'" dist/install.sh
          cd dist
          sha256sum llm-hud.tar.gz install.sh > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Smoke test release archive
        shell: bash
        run: |
          target="$RUNNER_TEMP/release-smoke"
          mkdir "$target"
          tar -xzf dist/llm-hud.tar.gz -C "$target"
          output=$(python -I -B "$target/llm-hud-$VERSION/bin/llm-hud" --version)
          test "$output" = "llm-hud $VERSION"

      - name: Install from the built release artifacts
        shell: bash
        env:
          LLM_HUD_INSTALL_DIR: ${{ runner.temp }}/release-install/root
          LLM_HUD_BIN_DIR: ${{ runner.temp }}/release-install/bin
          LLM_HUD_STATE_DIR: ${{ runner.temp }}/release-install/state
          LLM_HUD_CLAUDE_SETTINGS: ${{ runner.temp }}/release-install/claude.json
          LLM_HUD_CODEX_CONFIG: ${{ runner.temp }}/release-install/codex.toml
          LLM_HUD_CLAUDE_BIN: python
        run: |
          export LLM_HUD_TARBALL_URL="file://$PWD/dist/llm-hud.tar.gz"
          export LLM_HUD_CHECKSUM_URL="file://$PWD/dist/SHA256SUMS"
          mkdir -p "$RUNNER_TEMP/release-install/elsewhere"
          cd "$RUNNER_TEMP/release-install/elsewhere"
          sh "$GITHUB_WORKSPACE/dist/install.sh"
          output=$("$LLM_HUD_BIN_DIR/llm-hud" --version)
          test "$output" = "llm-hud $VERSION"
          "$LLM_HUD_BIN_DIR/llm-hud" doctor
          "$LLM_HUD_BIN_DIR/llm-hud" uninstall

      - name: Preserve the verified release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-artifacts
          path: |
            dist/llm-hud.tar.gz
            dist/SHA256SUMS
            dist/install.sh
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true

  windows_artifact_smoke:
    needs: build_artifacts
    runs-on: windows-latest
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.9"
      - name: Download the verified release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-artifacts
          path: dist
      - name: Install the release artifacts through Git Bash
        shell: bash
        env:
          VERSION: ${{ needs.build_artifacts.outputs.version }}
          LLM_HUD_CLAUDE_BIN: python
          LLM_HUD_CODEX_BIN: ""
          LLM_HUD_KIMI_BIN: ""
        run: |
          workspace=$(pwd -P)
          cd "$workspace/dist"
          sha256sum --check SHA256SUMS
          file_url_root=$(cygpath -m "$workspace/dist")
          export LLM_HUD_TARBALL_URL="file:///$file_url_root/llm-hud.tar.gz"
          export LLM_HUD_CHECKSUM_URL="file:///$file_url_root/SHA256SUMS"
          test_root=$(cygpath -u "$RUNNER_TEMP")/release-install
          export LLM_HUD_INSTALL_DIR="$test_root/root"
          export LLM_HUD_BIN_DIR="$test_root/bin"
          export LLM_HUD_STATE_DIR="$test_root/state"
          export LLM_HUD_CLAUDE_SETTINGS="$test_root/claude.json"
          export LLM_HUD_CODEX_CONFIG="$test_root/codex.toml"
          elsewhere="$test_root/elsewhere"
          mkdir -p "$elsewhere"
          cd "$elsewhere"
          sh "$workspace/dist/install.sh"
          output=$("$LLM_HUD_BIN_DIR/llm-hud" --version)
          test "$output" = "llm-hud $VERSION"
          "$LLM_HUD_BIN_DIR/llm-hud" doctor
          "$LLM_HUD_BIN_DIR/llm-hud" uninstall

  release:
    needs: [build_artifacts, windows_artifact_smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Download the Windows-verified release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-artifacts
          path: dist
      - name: Verify downloaded artifacts
        run: (cd dist && sha256sum --check SHA256SUMS)
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build_artifacts.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/llm-hud.tar.gz \
            dist/SHA256SUMS \
            dist/install.sh \
            --verify-tag \
            --generate-notes \
            --title "LLM HUD $VERSION"
